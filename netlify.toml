[build]
  command = "npm run build"
  publish = "dist"

# v1 launch: directory disabled — CDN-level redirect (force overrides the
# meta-refresh page Astro.redirect emits for the static route).
[[redirects]]
  from = "/work/directory"
  to = "/work"
  status = 302
  force = true

# v1 launch: internal prototype + font specimen disabled (same pattern).
[[redirects]]
  from = "/lab/globe"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/specimen"
  to = "/"
  status = 302
  force = true

# v2: process page gated until launch (same pattern) — remove with the
# redirect in process.astro + the sitemap exclude, one 3-file commit.
[[redirects]]
  from = "/process"
  to = "/"
  status = 302
  force = true
