[build]
  command = "npm run build"
  publish = "dist"

# v1 launch: directory disabled — CDN-level redirect (force overrides the
# meta-refresh page Astro.redirect emits for the static route).
[[redirects]]
  from = "/work/directory"
  to = "/work"
  status = 302
  force = true

# v1 launch: internal prototype + font specimen disabled (same pattern).
[[redirects]]
  from = "/lab/globe"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/specimen"
  to = "/"
  status = 302
  force = true

# FP-4b (2026-07-16): homegrwxn merged INTO rossi — permanent move; bellaire
# unfeatured for now — soft redirect until it returns.
[[redirects]]
  from = "/work/homegrwxn"
  to = "/work/rossi"
  status = 301
  force = true

[[redirects]]
  from = "/work/bellaire"
  to = "/work"
  status = 302
  force = true
